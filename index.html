往前推一步。\n\n最近，你在做什么？\n一个还在找用户的产品，一次没有跑通的增长实验，一套刚搭好的 AI 工作流，还是一个已经动手、却暂时卡住的问题？\n\n11 月 20 日晚上，我们想邀请一小群正在做事的人，在线上认真聊一次。\n\n「生姜同行夜」是 Gingiris 发起的小范围实践交流。这里不要求你带着成功案例来，也不靠职位和头衔认识彼此。我们更想知道：你做过什么、看到了什么，以及下一步还想弄清什么。\n\n你会经历什么？\n每人展示 5 分钟：3 分钟讲述 + 2 分钟交流。先讲清正在做的事，再与现场朋友进行即时问答和回应；这 5 分钟完整结束后，再进入下一位。全员展示后另有 3–4 人小组讨论，围绕问题继续深聊。结束前，为自己留下一个准备验证的下一步。\n不是一场只听讲的直播，也不是产品推销会。每位参与者都是内容的一部分。\n\n适合谁？\n正在做 AI、产品、增长、出海或开源实践的朋友；也欢迎已经开始尝试、但还没有成熟作品的探索者。没有融资、营收或个人主页门槛。\n\n带什么来？\n一份真实实践，以及一个你想讨论的问题。做成的、没做成的、仍在进行中的，都可以。可以用链接、截图或口述，不强制做 PPT。\n\n时间：2026 年 11 月 20 日（周五）20:00 开始，北京时间\n时长：预计 105–145 分钟，按确认人数于 21:45–22:25 之间结束；最终结束时间随会前确认通知明确\n形式：线上会议，19:50 开放入会；确认后发送参会入口\n席位：12–20 位参与者\n费用：首期免费，申请制\n发起：Gingiris 生姜\n\n如何参加？\n通过本活动报名入口，提交你正在做的事、准备分享的实践和最想讨论的一个问题。我们会根据内容具体度、交流意愿和话题互补性确认席位，而不是按职位或粉丝数筛选。\n建议在 11 月 18 日 20:00 前提交；报名后预计 48 小时内回复。提交不等于确认，满额后可自愿候补。\n\n我们希望你能全程参与。每人展示共 5 分钟，请提前准备 3 分钟讲述，随后留 2 分钟与大家交流；无需强制开摄像头，但请确保能够语音交流。临时不能来，请提前通知，把席位留给其他朋友。\n活动默认不录制、不生成自动纪要。公开引用观点、展示姓名或使用可识别截图，会另行征得同意。请勿分享公司机密、客户个人信息或未经授权的数据。\n\n我们不保证每个问题当晚都能解决。但希望这次认真交流，能让你多一条思路，多一个愿意继续聊的人，也多一个可以动手验证的下一步。\n\n生姜同行夜，和正在做事的人同行。`;\nconst social = `把正在做的事，往前推一步。\n\n11 月 20 日（周五）20:00，Gingiris 首期「生姜同行夜」在线上见。\n12–20 个席位，每人带一份真实实践和一个具体问题。每人展示 5 分钟：3 分钟讲述 + 2 分钟交流；全员展示后，再到 3–4 人的小组里继续深聊。\n20:00 准时开始，预计 21:45–22:25 结束，最终结束时间按确认人数在会前明确。\n\nAI / 产品 / 增长 / 出海 / 开源，做成的、没做成的、还在试的，都欢迎。\n不要求成功案例，不按头衔筛选；首期免费，申请制。\n\n不是再听一场直播，而是和同路人一起，找到一个更清楚的下一步。\n通过本活动报名入口提交你的实践与问题，11 月 18 日 20:00 前优先完成申请。`;\nconst opening = `欢迎来到生姜同行夜。今晚我们不靠头衔认识彼此，而是从各自正在做的事开始。\n每位朋友展示 5 分钟：3 分钟讲述 + 2 分钟交流。讲述时，背景一句话，做过的尝试和观察一两点，最后说一个最想讨论的问题。没有结果也没关系，真实比漂亮更重要。\n讲述到 3 分钟就转入现场交流，由主持人邀请提问、回应与追问；个人展示总计到 5 分钟收尾，再请下一位。问题也可以先写进聊天区。更长的讨论留到后半场小组，不挪用每人的 2 分钟交流。请回应具体问题，不做推销，不传播未经授权的信息。\n我们默认不录制、不自动转写；会后公开内容会另行确认授权。今晚不一定解决所有问题，但请为自己留下一个可验证的下一步。`;\nconst card = `生姜同行夜 · 实践卡\n称呼：\n我正在做：\n这次想聊的实践：\n我已经尝试了：\n我观察到的证据 / 反馈：\n我最想讨论的一个问题：\n可展示的材料（选填）：\n活动后补充：我准备在接下来一周尝试什么，怎样判断有没有帮助？\n可共享范围：仅本人 / 活动内 / 经复核后可公开（分别确认）`;\nfunction Sec({n,title,children}){const green=Number(n.slice(0,2))%2===1;retu
